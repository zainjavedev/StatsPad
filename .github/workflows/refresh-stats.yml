name: Refresh stats

# Pulls the in-progress season's per-game stats from ESPN and commits them when
# something changed; Vercel redeploys on that push. It runs every 15 minutes
# through the hours NBA games are played (17:00 to 07:59 UTC, which covers
# matinees through the last West Coast tip) and every two hours overnight. A run
# takes under a minute, and GitHub often starts scheduled runs late. Until the
# first game has been played the script writes nothing, so the site stays on
# last season.
on:
  schedule:
    - cron: '7,22,37,52 0-7,17-23 * * *'
    - cron: '27 8-16/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reuse rebound lookups
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-rebounds-${{ github.run_id }}
          restore-keys: espn-rebounds-
      - run: node scripts/fetch-espn-stats.mjs auto regular
      - run: node scripts/fetch-espn-stats.mjs auto playoffs
      - run: node scripts/build-careers.mjs
      - run: node scripts/build-headshots.mjs
      - run: node scripts/build-schedule.mjs
      - run: node scripts/build-preseason-stats.mjs
      - run: node scripts/build-regular-box-stats.mjs
      - run: node scripts/prune-rosters.mjs
      - name: Sync finished games to Postgres
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: node scripts/sync-espn-db.mjs
      - name: Commit changes
        run: |
          git add public/data
          if git diff --cached --quiet; then echo "No stat changes"; exit 0; fi
          git config user.name "StatsPad bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh stats"
          git push
