name: Refresh stats

# Pulls the in-progress season's per-game stats from ESPN and commits them when
# something changed; Vercel redeploys on that push. Games run roughly 12am to
# 10am Pakistan time (21:00 to 07:00 UTC). GitHub drops or delays many scheduled
# runs (an hourly schedule produced only about five runs a day, up to eleven hours apart), so
# during game hours it asks every fifteen minutes and a run takes under a minute; a
# lighter every-three-hours check covers the rest of the day. Until the first game
# has been played the script writes nothing, so the site stays on last season.
on:
  schedule:
    - cron: '3,18,33,48 21-23,0-7 * * *'
    - cron: '23 8-20/3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reuse rebound lookups
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-rebounds-${{ github.run_id }}
          restore-keys: espn-rebounds-
      - run: node scripts/fetch-espn-stats.mjs auto regular
      - run: node scripts/fetch-espn-stats.mjs auto playoffs
      - run: node scripts/build-careers.mjs
      - run: node scripts/build-headshots.mjs
      - run: node scripts/build-schedule.mjs
      - run: node scripts/build-preseason-stats.mjs
      - run: node scripts/build-regular-box-stats.mjs
      - run: node scripts/prune-rosters.mjs
      - name: Install dependencies for the Postgres sync
        if: env.DATABASE_URL != ''
        run: npm ci --omit=dev --ignore-scripts
      - name: Sync finished games to Postgres
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: node scripts/sync-espn-db.mjs
      - name: Commit changes
        run: |
          git add public/data
          if git diff --cached --quiet; then echo "No stat changes"; exit 0; fi
          git config user.name "StatsPad bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh stats"
          git push
